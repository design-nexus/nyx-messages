[package]
name = "nyx-messages"
version = "0.1.0"
description = "SMS and RCS for the Nyx Suite"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-messages"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "1b26675c47eef92b9488b44ff70bf668d9879955" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "1b26675c47eef92b9488b44ff70bf668d9879955" }
nyx-messages-proto = { path = "../../crates/nyx-messages-proto" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
webkit6 = { version = "0.6", features = ["v2_44"] }
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
